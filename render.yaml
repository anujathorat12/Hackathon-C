# One-click deploy on Render: New + > Blueprint > select this repo.
# Secrets are entered in the Render dashboard, never committed.
services:
  - type: web
    name: agent-101
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
